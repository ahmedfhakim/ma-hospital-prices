version: 2

sources:
  - name: hpt
    description: Output of the ingest package -- every hospital's price file, parsed to one standard layout.
    # DuckDB reads the Parquet / JSON files directly (external_location below).
    # Athena reads the same files from S3 through Glue tables that Terraform defines
    # (infra/glue.tf), in the Glue database named here.
    database: "{{ 'awsdatacatalog' if target.type == 'athena' else target.database }}"
    schema: "{{ var('athena_raw_database', 'hospital_prices_raw') if target.type == 'athena' else 'main' }}"
    tables:
      - name: charges
        description: >
          One row per item x setting x payer x plan, from every hospital.
          Rows with a NULL payer carry only gross / cash prices.
        meta:
          external_location: "read_parquet('{{ var('parquet_dir') }}/charges/*/*.parquet', hive_partitioning = true)"

      - name: hospitals
        description: One record per hospital file -- header metadata plus ingestion lineage.
        meta:
          external_location: "read_json('{{ var('parquet_dir') }}/hospitals/*.json', union_by_name = true)"
